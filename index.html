<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ریاضی‌یار هشتم | دستیار ریاضی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Lalezar&display=swap" rel="stylesheet">
<style>


:root{
  --green:#58a96b;
  --green-dark:#287a4b;
  --green-light:#dff6df;
  --yellow:#ffd85c;
  --yellow-soft:#fff4bd;
  --pink:#ff9fbd;
  --pink-soft:#ffe3ec;
  --blue:#74c8ef;
  --purple:#a993e8;
  --cream:#fffdf5;
  --white:#ffffff;
  --ink:#263b2c;
  --line:#d7ead7;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  font-family:'Vazirmatn',Tahoma,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 12%,var(--yellow-soft) 0 10%,transparent 24%),
    radial-gradient(circle at 92% 18%,var(--pink-soft) 0 9%,transparent 23%),
    radial-gradient(circle at 10% 90%,#dff1ff 0 10%,transparent 25%),
    radial-gradient(circle at 94% 88%,#e9ddff 0 9%,transparent 23%),
    linear-gradient(135deg,#f8fff6,#f5fbff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  overflow:hidden;
}

/* colorful school doodles */
.leaf{
  position:fixed;
  width:52px;
  height:52px;
  opacity:.75;
  pointer-events:none;
  border-radius:50% 15% 50% 15%;
  transform:rotate(25deg);
  animation:floaty 7s ease-in-out infinite alternate;
}
.leaf:nth-child(1){top:8%;right:7%;background:var(--yellow);box-shadow:0 8px 20px #e8c94b55}
.leaf:nth-child(2){top:64%;right:5%;width:30px;height:30px;background:var(--pink);animation-delay:-2s}
.leaf:nth-child(3){top:18%;left:5%;width:40px;height:40px;background:var(--blue);animation-delay:-4s}
.leaf:nth-child(4){bottom:8%;left:8%;width:58px;height:58px;background:var(--purple);animation-delay:-1s}

@keyframes floaty{
  from{transform:translateY(0) rotate(20deg)}
  to{transform:translateY(-15px) rotate(55deg)}
}

.shell{
  position:relative;
  z-index:1;
  width:min(590px,100%);
  height:min(860px,94vh);
  background:var(--white);
  border:5px solid var(--green);
  border-radius:32px;
  box-shadow:
    0 0 0 7px #fff,
    0 18px 55px rgba(53,112,70,.20);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* header */
header{
  text-align:center;
  padding:24px 22px 18px;
  background:
    linear-gradient(135deg,#65b976,#3f9b60);
  color:white;
  position:relative;
  border-bottom:7px solid var(--yellow);
}

header:before,
header:after{
  content:"";
  position:absolute;
  border-radius:50%;
  opacity:.45;
}
header:before{
  width:90px;height:90px;
  background:var(--yellow);
  top:-45px;right:-20px;
}
header:after{
  width:65px;height:65px;
  background:var(--pink);
  bottom:-30px;left:-15px;
}

header h1{
  font-family:'Lalezar','Vazirmatn',cursive;
  font-weight:400;
  font-size:2.35rem;
  letter-spacing:.4px;
  position:relative;
  z-index:2;
  text-shadow:0 2px 0 #287a4b55;
}

header p{
  font-size:.88rem;
  color:white;
  margin-top:1px;
  position:relative;
  z-index:2;
}

.tools{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:9px;
  flex-wrap:wrap;
  position:relative;
  z-index:3;
}

.chip{
  border:2px solid rgba(255,255,255,.9);
  background:white;
  color:var(--green-dark);
  font:inherit;
  font-size:.74rem;
  font-weight:600;
  padding:6px 12px;
  border-radius:99px;
  cursor:pointer;
  transition:.2s ease;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.chip:hover,.chip[aria-pressed="true"]{
  background:var(--yellow);
  border-color:var(--yellow);
  color:#5b4a0a;
  transform:translateY(-2px);
}

/* chat */
#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 20px 14px;
  display:flex;
  flex-direction:column;
  gap:13px;
  scroll-behavior:smooth;
  background:
    radial-gradient(circle at 95% 5%,#fff4bd55,transparent 25%),
    var(--cream);
}

#chat::-webkit-scrollbar{width:7px}
#chat::-webkit-scrollbar-thumb{
  background:#a9d8ae;
  border-radius:20px;
}

.msg{
  max-width:88%;
  padding:13px 16px;
  font-size:.94rem;
  line-height:1.95;
  word-wrap:break-word;
  box-shadow:0 4px 12px rgba(64,112,72,.08);
}

.bot{
  align-self:flex-start;
  background:white;
  border:2px solid var(--green-light);
  color:var(--ink);
  border-radius:20px 20px 20px 6px;
  position:relative;
}

.bot:before{
  content:"🌱";
  position:absolute;
  right:-9px;
  top:-13px;
  font-size:18px;
}

.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#65b976,#358c55);
  color:white;
  border-radius:20px 20px 6px 20px;
  box-shadow:0 6px 15px rgba(53,140,85,.20);
}

.msg strong{color:var(--green-dark)}
.user strong{color:white}

.typing span{
  display:inline-block;
  width:7px;height:7px;
  margin:0 2px;
  background:var(--green);
  border-radius:50%;
  animation:b 1s infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes b{
  0%,80%,100%{transform:translateY(0)}
  40%{transform:translateY(-6px)}
}

.msg mjx-container{
  direction:ltr !important;
  margin:.45em 0 !important;
}
.msg mjx-container[display="true"]{
  overflow-x:auto;
  overflow-y:hidden;
  max-width:100%;
  padding:5px 0;
}

/* input */
form{
  display:flex;
  gap:9px;
  padding:13px 17px 17px;
  border-top:2px solid var(--green-light);
  background:white;
}

input{
  flex:1;
  font:inherit;
  font-size:.93rem;
  padding:13px 18px;
  border:2px solid #cfe5d0;
  border-radius:99px;
  background:#f8fff7;
  color:var(--ink);
  outline:none;
  transition:.2s;
}

input::placeholder{color:#91a593}

input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 4px #dff6df;
}

button.send{
  width:48px;height:48px;
  border:3px solid white;
  border-radius:50%;
  cursor:pointer;
  color:white;
  font-size:1.15rem;
  background:linear-gradient(135deg,#72bd7e,#338d55);
  box-shadow:0 4px 12px rgba(53,140,85,.25);
  transition:.15s;
}

button.send:hover{
  transform:scale(1.08) rotate(-4deg);
  background:linear-gradient(135deg,#ffd85c,#ffb83e);
  color:#4f4a20;
}

button.send:disabled{opacity:.5;cursor:wait}

button:focus-visible,input:focus-visible{
  outline:3px solid var(--yellow);
  outline-offset:2px;
}

@media (max-width:600px){
  body{padding:0}
  .shell{
    width:100%;
    height:100%;
    max-height:none;
    border-radius:0;
    border-width:4px;
  }
  header{padding-top:22px}
  #chat{padding-left:14px;padding-right:14px}
  .msg{max-width:93%}
}

@media (prefers-reduced-motion:reduce){
  .leaf{animation:none}
  #chat{scroll-behavior:auto}
}

</style>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']],
    processEscapes: true
  },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

</head>
<body>
<i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i>

<main class="shell">
  <header>
    <div style="font-size:1.7rem;margin-bottom:1px;">📚 ✏️ 🧮</div>
    <h1>ریاضی‌یار هشتم</h1>
    <p>باهم حل می‌کنیم، باهم یاد می‌گیریم! 🌱✨</p>
      <div class="tools">
        <button class="chip" type="button" onclick="quickQuestion('عددهای گویا را توضیح بده')">عددهای گویا</button>
        <button class="chip" type="button" onclick="quickQuestion('یک معادله درجه اول را مرحله‌به‌مرحله حل کن')">معادله</button>
        <button class="chip" type="button" onclick="quickQuestion('قانون فیثاغورس را با مثال توضیح بده')">فیثاغورس</button>
      </div>
  </header>
  <div id="chat" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="سؤال ریاضی هشتمت رو بنویس..." aria-label="پیام شما">
    <button class="send" id="sendBtn" type="submit" aria-label="ارسال">&#10148;</button>
  </form>
</main>

<script>
/* ⚠️ کلید API رو اینجا نذار! هر کسی صفحه رو باز کنه کلید رو می‌بینه.
   برای استفاده واقعی، یه سرور (بک‌اند) بنویس که درخواست‌ها رو به API بفرسته و BASE_URL رو به اون تغییر بده. */
const API_KEY  = 'sk-scqIogCd5s4vW1ON2zgpsFc3FCuuqTNWXE5RfU0IXPdxWcxp';
const BASE_URL = "https://api.gapgpt.app/v1";

const SYSTEM_PROMPT = `
تو «ریاضی‌یار هشتم» هستی؛ یک دستیار آموزشی برای دانش‌آموز پایه هشتم.
فقط روی ریاضی پایه هشتم تمرکز کن و پاسخ‌ها را به فارسی و ساده بده.

قوانین:
- سؤال را اول دقیق بررسی کن.
- اگر مسئله محاسباتی است، راه‌حل را مرحله‌به‌مرحله بنویس.
- جواب نهایی را واضح و در انتهای پاسخ مشخص کن.
- از توضیح‌های مناسب دانش‌آموز پایه هشتم استفاده کن.
- اگر سؤال مربوط به موضوعی غیر از ریاضی هشتم بود، مؤدبانه بگو که برای ریاضی هشتم طراحی شده‌ای.
- اگر صورت سؤال ناقص است، از کاربر بخواه بخش ناقص را بفرستد.
- از فرمول‌های لازم استفاده کن و معنی نمادها را در صورت نیاز توضیح بده.
- همه فرمول‌های ریاضی را با LaTeX بنویس: فرمول داخل متن با \( ... \) و فرمول جداگانه با $$ ... $$.
- برای توان از x^2، برای کسر از \frac{a}{b} و برای رادیکال از \sqrt{x} استفاده کن.
- از نوشتن فرمول با ستاره‌های Markdown مثل **x^2** خودداری کن.
- فرمول‌های چندمرحله‌ای را هر مرحله در یک خط جدا بنویس.
- لحن دوستانه، تشویق‌کننده و آموزشی داشته باش.
- تا جای ممکن از مثال کوتاه برای روشن شدن مفهوم استفاده کن.
`;

const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let ended = false;
const history = [{ role: 'system', content: SYSTEM_PROMPT }];

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatAnswer(text){
  // Keep LaTeX intact, while making common Markdown readable.
  const parts = text.split(/(\\\([^]*?\\\)|\$\$[^]*?\$\$|\$[^$\n]*\$)/g);
  return parts.map((part, i) => {
    if (/^\\\(|^\$\$|^\$/.test(part)) return part;
    return escapeHtml(part)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^###\s+(.*)$/gm, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }).join('');
}

function renderMath(el){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetPromise([el]).catch(err => console.error('MathJax:', err));
  }
}

function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  if(who === 'bot'){
    d.innerHTML = formatAnswer(text);
    renderMath(d);
  }else{
    d.textContent = text;
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

addMsg('سلام! 🌱 من ریاضی‌یار هشتم هستم. سؤال ریاضی‌ات رو بفرست تا مرحله‌به‌مرحله باهم حلش کنیم.', 'bot');

function quickQuestion(q){
  if(ended) return;
  input.value = q;
  form.requestSubmit();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text || ended) return;
  input.value = '';
  addMsg(text, 'user');

  if(text === 'خداحافظ'){
    addMsg('درپناه حق 🌿', 'bot');
    ended = true; input.disabled = true; sendBtn.disabled = true;
    return;
  }

  history.push({ role: 'user', content: text });
  sendBtn.disabled = true;
  const wait = addMsg('', 'bot');
  wait.classList.add('typing');
  wait.innerHTML = '<span></span><span></span><span></span>';

  try{
    const r = await fetch(BASE_URL + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
      body: JSON.stringify({ model: 'gapgpt-qwen-3.6', messages: history })
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const answer = data.choices[0].message.content;
    history.push({ role: 'assistant', content: answer });
    wait.classList.remove('typing');
    wait.innerHTML = formatAnswer(answer);
    renderMath(wait);
  }catch(err){
    history.pop();
    wait.classList.remove('typing');
    wait.textContent = 'ارتباط با سرور برقرار نشد. دوباره پیامت رو بفرست.';
    console.error(err);
  }finally{
    sendBtn.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
});
</script>
</body>
</html>
