<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ریاضی‌یار | دستیار ریاضی هفتم به بالا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--green:#58a96b;--dark:#287a4b;--light:#dff6df;--yellow:#ffd85c;--cream:#fffdf5;--ink:#263b2c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8fff6,#f5fbff);display:flex;justify-content:center;align-items:center;padding:18px}
.shell{width:min(700px,100%);height:min(900px,95vh);background:#fff;border:5px solid var(--green);border-radius:30px;box-shadow:0 18px 55px #35704633;display:flex;flex-direction:column;overflow:hidden}
header{text-align:center;padding:20px;background:linear-gradient(135deg,#65b976,#3f9b60);color:#fff;border-bottom:7px solid var(--yellow)}
h1{font-family:Lalezar,Vazirmatn,cursive;font-size:2.2rem;margin:0}header p{margin:3px 0 10px}
.tools{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.chip{border:2px solid #fff;background:#fff;color:var(--dark);font:inherit;font-size:.78rem;padding:7px 12px;border-radius:99px;cursor:pointer}
#grade{font:inherit;border:2px solid #fff;border-radius:99px;padding:7px 12px;background:#fff;color:var(--dark)}
#chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--cream)}
.msg{max-width:90%;padding:13px 16px;line-height:2;font-size:.95rem;word-wrap:break-word;box-shadow:0 4px 12px #40704814}
.bot{align-self:flex-start;background:#fff;border:2px solid var(--light);border-radius:20px 20px 20px 6px}.user{align-self:flex-end;background:linear-gradient(135deg,#65b976,#358c55);color:#fff;border-radius:20px 20px 6px 20px}
.msg mjx-container{direction:ltr!important;margin:.45em 0!important}.msg mjx-container[display=true]{overflow-x:auto;max-width:100%;padding:5px 0}
form{display:flex;gap:9px;padding:13px 17px 17px;border-top:2px solid var(--light);background:#fff}
input{flex:1;font:inherit;padding:13px 18px;border:2px solid #cfe5d0;border-radius:99px;background:#f8fff7;outline:none}
button.send{width:48px;height:48px;border:0;border-radius:50%;cursor:pointer;color:#fff;font-size:1.15rem;background:linear-gradient(135deg,#72bd7e,#338d55)}
button:disabled{opacity:.5;cursor:wait}
@media(max-width:600px){body{padding:0}.shell{width:100%;height:100%;border-radius:0;border-width:4px}}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']],processEscapes:true},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
<main class="shell">
<header>
<div style="font-size:1.6rem">📚 ✏️ 🧮</div>
<h1>ریاضی‌یار</h1>
<p>دستیار ریاضی پایه هفتم به بالا 🌱</p>
<div class="tools">
<select id="grade" aria-label="پایه">
<option value="auto">تشخیص پایه</option><option value="7">هفتم</option><option value="8">هشتم</option>
<option value="9">نهم</option><option value="10">دهم</option><option value="11">یازدهم</option><option value="12">دوازدهم</option>
</select>
<button class="chip" type="button" onclick="quickQuestion('فرمول‌های مهم این پایه را دسته‌بندی کن')">📐 فرمول‌ها</button>
<button class="chip" type="button" onclick="quickQuestion('یک مسئله نمونه را مرحله‌به‌مرحله حل کن')">🧩 مثال</button>
</div>
</header>
<div id="chat" aria-live="polite"></div>
<form id="form" autocomplete="off">
<input id="input" placeholder="سؤال ریاضی‌ات را بنویس..." aria-label="پیام شما">
<button class="send" id="sendBtn" aria-label="ارسال">➤</button>
</form>
</main>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('input'),sendBtn=document.getElementById('sendBtn'),grade=document.getElementById('grade');
const history=[];
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function formatAnswer(text){
  const parts=text.split(/(\\\([^]*?\\\)|\\\[[^]*?\\\]|\$\$[^]*?\$\$|\$[^$\n]*\$)/g);
  return parts.map(p=>/^\\\(|^\\\[|^\$\$|^\$/.test(p)?p:escapeHtml(p).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/^###\s+(.*)$/gm,'<strong>$1</strong>').replace(/\n/g,'<br>')).join('');
}
function renderMath(el){if(window.MathJax?.typesetPromise)MathJax.typesetPromise([el]).catch(console.error)}
function addMsg(text,who){const d=document.createElement('div');d.className='msg '+who;d.innerHTML=who==='bot'?formatAnswer(text):escapeHtml(text);chat.appendChild(d);if(who==='bot')renderMath(d);chat.scrollTop=chat.scrollHeight;return d}
addMsg('سلام! 🌱 پایه‌ات را انتخاب کن یا سؤال ریاضی‌ات را بفرست. من راه‌حل را مرحله‌به‌مرحله و فرمول‌ها را با نمایش درست ریاضی ارائه می‌کنم.','bot');
function quickQuestion(q){input.value=q;form.requestSubmit()}
form.addEventListener('submit',async e=>{
 e.preventDefault();const text=input.value.trim();if(!text)return;
 input.value='';addMsg(text,'user');sendBtn.disabled=true;
 const wait=addMsg('در حال بررسی سؤال و فرمول‌های مرتبط…','bot');
 try{
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,grade:grade.value,history})});
   const data=await r.json();if(!r.ok)throw new Error(data.error||'خطای سرور');
   history.push({role:'user',content:text},{role:'assistant',content:data.answer});
   wait.innerHTML=formatAnswer(data.answer);renderMath(wait);
 }catch(err){wait.textContent='ارتباط با سرور برقرار نشد. تنظیمات سرور و کلید API را بررسی کن.';console.error(err)}
 finally{sendBtn.disabled=false;input.focus()}
});
</script>
</body>
</html>
